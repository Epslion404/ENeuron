[pytest]
# archive/legacy 已冻结为历史追溯材料，不参与当前 ZYNQ7020 日常门。
norecursedirs =
    archive
    .git
    .planning
    .pytest_cache
    .Xil

# 这些根级测试仍依赖归档前的相对路径；保留文件，但不作为当前主线合同。
addopts =
    --ignore=test_formal_local_prune_commit_barrier.py
    --ignore=test_compare_simulation.py
    --ignore=test_np4b5_negative_controls.py
    --ignore=test_rtl_cosim.py
    --ignore=test_rtl_smoke.py
    --ignore=test_rtl_tile_cosim.py
    --ignore=test_run_digit8x8_d2.py
    --ignore=test_run_local_prune_b1.py
    --ignore=test_run_local_prune_b2.py
    --ignore=test_run_local_prune_b21.py
    --ignore=test_run_local_prune_np2.py
    --ignore=test_run_local_prune_np3.py
    --ignore=test_verify_local_prune_rtl.py
