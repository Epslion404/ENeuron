name: ENeuron PR Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  classify-changes:
    name: Classify changes
    runs-on: ubuntu-latest
    outputs:
      npu_oracle: ${{ steps.classify.outputs.npu_oracle }}
      full_repository: ${{ steps.classify.outputs.full_repository }}
      xpm_cdc: ${{ steps.classify.outputs.xpm_cdc }}
      np7_functional: ${{ steps.classify.outputs.np7_functional }}
      np7_physical: ${{ steps.classify.outputs.np7_physical }}
      t1_repro: ${{ steps.classify.outputs.t1_repro }}
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Classify affected verification scopes
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            python -X utf8 tools/ci/classify_changes.py --all --github-output "${GITHUB_OUTPUT}"
          else
            python -X utf8 tools/ci/classify_changes.py \
              --base "${BASE_SHA}" --head "${HEAD_SHA}" --github-output "${GITHUB_OUTPUT}"
          fi

  fast-check:
    name: Fast Python and diff check
    needs: classify-changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Compile Python sources
        run: python -X utf8 -m compileall -q .
      - name: Run NPU oracle tests
        if: needs['classify-changes'].outputs.npu_oracle == 'true'
        run: python -X utf8 -m unittest -v test_npu_eneuron_reference
      - name: Check PR diff whitespace
        if: github.event_name == 'pull_request'
        run: git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"

  full-repository:
    name: Full repository regression
    needs: classify-changes
    if: needs['classify-changes'].outputs.full_repository == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install open-source HDL tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y iverilog yosys
      - name: Run repository unit tests
        run: python -X utf8 -m unittest discover -v

  windows-xpm-cdc:
    name: XPM CDC wrapper (Windows MSYS2 UCRT64)
    needs: classify-changes
    if: needs['classify-changes'].outputs.xpm_cdc == 'true'
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Icarus Verilog with MSYS2 UCRT64
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          location: C:\msys64
          update: false
          install: mingw-w64-ucrt-x86_64-iverilog
      - name: Verify fixed toolchain
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        shell: bash
        run: |
          FIXED="/c/msys64/ucrt64"
          if [ ! -x "${FIXED}/bin/iverilog.exe" ] || [ ! -x "${FIXED}/bin/vvp.exe" ]; then
            SRC=""
            for cand in "${MSYS2_LOCATION:-}" "${MSYS2_LOCATION:-}/msys64"; do
              [ -n "${cand}" ] || continue
              probe="$(cygpath -u "${cand}")/ucrt64"
              if [ -x "${probe}/bin/iverilog.exe" ] && [ -x "${probe}/bin/vvp.exe" ]; then
                SRC="${probe}"
                break
              fi
            done
            if [ -z "${SRC}" ]; then
              echo "::error title=MSYS2 UCRT64 tree not found::no ucrt64/bin/iverilog.exe below ${MSYS2_LOCATION:-unset}"
              exit 1
            fi
            WIN_SRC="$(cygpath -w "${SRC}")"
            powershell.exe -NoProfile -Command "New-Item -ItemType Directory -Force -Path 'C:\msys64' > \$null; if (-not (Test-Path 'C:\msys64\ucrt64')) { New-Item -ItemType Junction -Path 'C:\msys64\ucrt64' -Target '${WIN_SRC}' > \$null }" || true
            if [ ! -x "${FIXED}/bin/iverilog.exe" ]; then
              mkdir -p "${FIXED}"
              cp -a "${SRC}/." "${FIXED}/"
            fi
          fi
          test -x "${FIXED}/bin/iverilog.exe"
          test -x "${FIXED}/bin/vvp.exe"
          "${FIXED}/bin/iverilog.exe" -V | head -n 1
      - name: Run XPM CDC wrapper tests on Windows
        shell: bash
        run: |
          python -X utf8 -m unittest -v test_host_bridge_xpm_wrapper 2>&1 | tee "${RUNNER_TEMP}/xpm_windows.log"
          if grep -q "NOT APPLICABLE\|TOOLCHAIN_DEFECT" "${RUNNER_TEMP}/xpm_windows.log"; then
            echo "::error title=XPM wrapper not exercised::the required Windows toolchain test did not execute"
            exit 1
          fi

  np7-functional:
    name: NP7 functional and evidence gate
    needs: classify-changes
    if: needs['classify-changes'].outputs.np7_functional == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install open-source HDL tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y iverilog yosys
      - name: Run NP7 oracle tests
        run: python -X utf8 -m unittest -v test_np7_shared_lane_oracle
      - name: Run NP7 cycle-accurate cosimulation
        run: python -X utf8 np7_shared_lane_cosim.py
      - name: Run three-model integration
        run: python -X utf8 np7_three_model_integration_cosim.py
      - name: Run formal and mutation checks
        run: python -X utf8 np7_formal_and_mutations.py
      - name: Verify software evidence against PR HEAD
        run: python -X utf8 verify_np7_software_cost.py "${{ github.event.pull_request.head.sha || github.sha }}"

  np7-physical-evidence:
    name: NP7 physical evidence integrity
    needs: classify-changes
    if: needs['classify-changes'].outputs.np7_physical == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Run physical evidence verifier
        run: python -X utf8 verify_np7_physical_cost.py "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Run physical-evidence mutation checks
        run: python -X utf8 test_np7_physical_mutations.py

  t1-repro:
    name: T1 reproducibility slice
    needs: classify-changes
    if: needs['classify-changes'].outputs.t1_repro == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y iverilog
      - name: Run repository reproducibility gate
        run: python -X utf8 tools/repro/verify_repository.py --t1

  pr-gate:
    name: PR Gate
    if: always()
    needs: [classify-changes, fast-check, full-repository, windows-xpm-cdc, np7-functional, np7-physical-evidence, t1-repro]
    runs-on: ubuntu-latest
    steps:
      - name: Require selected scopes to pass
        env:
          RESULTS: ${{ needs['classify-changes'].result }} ${{ needs['fast-check'].result }} ${{ needs['full-repository'].result }} ${{ needs['windows-xpm-cdc'].result }} ${{ needs['np7-functional'].result }} ${{ needs['np7-physical-evidence'].result }} ${{ needs['t1-repro'].result }}
        shell: bash
        run: |
          echo "results=${RESULTS}"
          for result in ${RESULTS}; do
            [[ "${result}" == "success" || "${result}" == "skipped" ]] || exit 1
          done
