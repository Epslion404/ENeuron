name: ENeuron PR Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python-and-syntax:
    name: Python and syntax
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install open-source HDL tools for portable tests
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y iverilog yosys
          echo "APT_ICARUS_VERSION=$(iverilog -V | head -n 1)"
          echo "APT_YOSYS_VERSION=$(yosys --version || true)"

      - name: Compile Python sources
        run: python -X utf8 -m compileall -q .

      - name: Run repository unit tests
        shell: bash
        run: |
          set +e
          python -X utf8 -m unittest discover -v > "${RUNNER_TEMP}/discover.log" 2>&1
          discover_status=$?
          set -e
          echo "discover_exit_code=${discover_status}"
          echo "UBUNTU_XPM_NOTICE_BEGIN"
          grep -n "NOT APPLICABLE" "${RUNNER_TEMP}/discover.log" \
            || echo "no SKIPPED/NOT APPLICABLE notice was emitted on Ubuntu"
          echo "UBUNTU_XPM_NOTICE_END"
          grep -n "^Ran \|^OK\|^FAILED" "${RUNNER_TEMP}/discover.log" || true
          cat "${RUNNER_TEMP}/discover.log"
          exit "${discover_status}"

      - name: Check PR diff whitespace
        if: github.event_name == 'pull_request'
        run: git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"

  windows-xpm-cdc:
    name: XPM CDC wrapper (Windows MSYS2 UCRT64)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Icarus Verilog with MSYS2 UCRT64
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          location: C:\msys64
          update: true
          install: mingw-w64-ucrt-x86_64-iverilog

      - name: Provision and verify the fixed C:/msys64/ucrt64/bin toolchain
        shell: bash
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          echo "setup_msys2_location=${MSYS2_LOCATION:-unset}"
          echo "ruled_fixed_path=C:/msys64/ucrt64/bin (Windows + MSYS2 UCRT64 only)"
          if [ ! -x "C:/msys64/ucrt64/bin/iverilog.exe" ] && [ -n "${MSYS2_LOCATION:-}" ]; then
            SRC="$(cygpath -u "${MSYS2_LOCATION}")/ucrt64/bin"
            if [ -x "${SRC}/iverilog.exe" ]; then
              echo "MSYS2 was installed elsewhere; copying the UCRT64 bin tree into the ruled fixed path"
              mkdir -p /c/msys64/ucrt64
              cp -r "${SRC}" /c/msys64/ucrt64/bin
            fi
          fi
          if [ ! -x "C:/msys64/ucrt64/bin/iverilog.exe" ] || [ ! -x "C:/msys64/ucrt64/bin/vvp.exe" ]; then
            echo "::error title=Fixed toolchain path not provisioned::C:/msys64/ucrt64/bin/iverilog.exe or vvp.exe is missing on the Windows runner. This is a CI environment problem, not an RTL functional failure."
            ls -l /c/msys64/ucrt64/bin 2>/dev/null || echo "C:/msys64/ucrt64/bin does not exist"
            exit 1
          fi
          ls -l "C:/msys64/ucrt64/bin/iverilog.exe" "C:/msys64/ucrt64/bin/vvp.exe"
          "C:/msys64/ucrt64/bin/iverilog.exe" -V | head -n 1
          "C:/msys64/ucrt64/bin/vvp.exe" -V | head -n 1 || echo "vvp -V is not supported by this build"

      - name: Run XPM CDC wrapper tests on Windows
        shell: bash
        run: |
          set +e
          python -X utf8 -m unittest -v test_host_bridge_xpm_wrapper > "${RUNNER_TEMP}/xpm_windows.log" 2>&1
          xpm_status=$?
          set -e
          cat "${RUNNER_TEMP}/xpm_windows.log"
          if grep -q "NOT APPLICABLE" "${RUNNER_TEMP}/xpm_windows.log"; then
            echo "::error title=XPM wrapper skipped::test_host_bridge_xpm_wrapper was SKIPPED on the Windows runner, so the fixed MSYS2 UCRT64 toolchain was not really exercised"
            exit 1
          fi
          if grep -q "TOOLCHAIN_DEFECT" "${RUNNER_TEMP}/xpm_windows.log"; then
            echo "::error title=toolchain defect::the MSYS2 UCRT64 Icarus build on the Windows runner hit a silent-crash toolchain defect"
            exit 1
          fi
          if [ "${xpm_status}" -ne 0 ]; then
            echo "XPM_WINDOWS_GATE=FAIL exit_code=${xpm_status}"
            exit "${xpm_status}"
          fi
          grep -n "^Ran \|^OK" "${RUNNER_TEMP}/xpm_windows.log" || true
          echo "XPM_WINDOWS_GATE=PASS"

  np7-functional:
    name: NP7 functional and evidence gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Detect NP7 scope
        id: detect
        shell: bash
        run: |
          if [[ -f np7_shared_lane_cosim.py && -f verify_np7_software_cost.py && -f verify_np7_physical_cost.py ]]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
            echo 'NP7_SCOPE=enabled'
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo 'NP7_SCOPE=not-applicable'
          fi

      - name: Install open-source HDL tools
        if: steps.detect.outputs.enabled == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y iverilog yosys

      - name: Run NP7 oracle tests
        if: steps.detect.outputs.enabled == 'true'
        run: python -X utf8 -m unittest -v test_np7_shared_lane_oracle

      - name: Run NP7 cycle-accurate cosimulation
        if: steps.detect.outputs.enabled == 'true'
        run: python -X utf8 np7_shared_lane_cosim.py

      - name: Run three-model integration
        if: steps.detect.outputs.enabled == 'true'
        run: python -X utf8 np7_three_model_integration_cosim.py

      - name: Run formal and mutation checks
        if: steps.detect.outputs.enabled == 'true'
        run: python -X utf8 np7_formal_and_mutations.py

      - name: Verify software evidence against PR HEAD
        if: steps.detect.outputs.enabled == 'true'
        run: python -X utf8 verify_np7_software_cost.py "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Upload NP7 software evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: np7-software-failure-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            artifacts/logs/**
            artifacts/results/**

  np7-physical-evidence:
    name: NP7 physical evidence integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Detect NP7 physical scope
        id: detect
        shell: bash
        run: |
          if [[ -f verify_np7_physical_cost.py && -f test_np7_physical_mutations.py ]]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
            echo 'NP7_PHYSICAL_SCOPE=enabled'
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo 'NP7_PHYSICAL_SCOPE=not-applicable'
          fi

      - name: Run physical evidence verifier
        if: steps.detect.outputs.enabled == 'true'
        run: python -X utf8 verify_np7_physical_cost.py "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Run physical-evidence mutation checks
        if: steps.detect.outputs.enabled == 'true'
        run: python -X utf8 test_np7_physical_mutations.py

      - name: Upload physical evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: np7-physical-failure-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            artifacts/logs/**
            artifacts/results/**
            vivado_np7_ooc_*_reports/**
